services:
  - type: web
    name: reverie-hypothesis-engine
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: WOLFRAM_APP_ID
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.6
